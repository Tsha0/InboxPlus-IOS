name: iOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Shared and authenticated transport tests
        run: swift test
      - name: Build real Mac companion
        run: INBOXPLUS_BUILD_COMPANION=1 swift build --product InboxPlusCompanion --scratch-path .build-companion
      - name: Choose iPhone and iPad simulators
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          available=[d for runtime, group in devices.items() if 'iOS' in runtime for d in group]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for kind in ['iPhone','iPad']:
                  device=next(d for d in available if kind in d['name'])
                  f.write(f"{kind.upper()}_UDID={device['udid']}\n")
          PY
      - name: Run iPhone UI tests
        run: xcodebuild -project iOS/InboxPlusIOS.xcodeproj -scheme InboxPlusIOS -destination "platform=iOS Simulator,id=$IPHONE_UDID" -derivedDataPath build/DerivedData -resultBundlePath build/iPhone.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Run iPad UI tests
        run: xcodebuild -project iOS/InboxPlusIOS.xcodeproj -scheme InboxPlusIOS -destination "platform=iOS Simulator,id=$IPAD_UDID" -derivedDataPath build/DerivedData -resultBundlePath build/iPad.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Save simulator test reports and app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InboxPlus-iOS-test-results
          path: |
            build/*.xcresult
            build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
