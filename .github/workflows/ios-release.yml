name: iOS release
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric app version, for example 0.2.0'
        required: true
        type: string
      destination:
        description: 'Validate the archive, or upload to TestFlight'
        required: true
        default: validate
        type: choice
        options: [validate, testflight]
permissions:
  contents: read
  actions: read
concurrency:
  group: ios-release
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
jobs:
  validate:
    name: Verify tested source and archive
    if: startsWith(github.ref, 'refs/tags/ios-v') || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then VERSION="${GITHUB_REF#refs/tags/ios-v}"; else VERSION="$INPUT_VERSION"; fi
          RELEASE_VERSION="$VERSION" python3 - <<'PY'
          import importlib.util,os
          spec=importlib.util.spec_from_file_location('release','Scripts/ci/verify-release.py');module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          version=module.validate_version(os.environ['RELEASE_VERSION'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('version='+version+'\n')
          PY
      - name: Require exact green main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 Scripts/ci/verify-release.py
      - name: Validate unsigned archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: xcodebuild -project iOS/InboxPlusIOS.xcodeproj -scheme InboxPlusIOS -configuration Release -destination 'generic/platform=iOS' -archivePath build/InboxPlusIOS-validation.xcarchive CODE_SIGNING_ALLOWED=NO "MARKETING_VERSION=$VERSION" "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive > build/archive-validation.log 2>&1
      - name: Save validated archive and source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release-validation
          path: |
            build/InboxPlusIOS-validation.xcarchive
            build/release-source.json
            build/archive-validation.log
          retention-days: 30
  testflight:
    name: Signed TestFlight upload
    needs: validate
    if: startsWith(github.ref, 'refs/tags/ios-v') || inputs.destination == 'testflight'
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      IOS_DISTRIBUTION_CERTIFICATE_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_B64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci/verify-release.py
      - name: Sign, export, and upload
        run: bash Scripts/ci/release-ios.sh
      - name: Retain release artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-testflight-release
          path: |
            build/InboxPlusIOS.xcarchive
            build/export/*.ipa
            build/release-source.json
            build/*.log
          retention-days: 30
